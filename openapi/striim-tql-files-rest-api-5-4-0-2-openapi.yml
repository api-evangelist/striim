    get:
      description: |-
        Returns monitoring report for the specified application, source, or target.

        Specify **applicationName** as `<namespace>.<application name>` (the fully qualified name), for example, `Samples.PosApp`, or `<namespace>.<component name>`, for example, `Samples.CsvDataSource`.

        Specify **starttime** and **endtime** as `HH:mm` (current day), `yyyy/MM/dd-HH:mm`, `yyyy/MM/dd-HH:mm:ss`, or `yyyy/MM/dd-HH:mm:ss:SSS`. 

        The default rollup interval is 15 minutes. To change that, specify **rollupinterval** as `30m` (30 minutes) or `1h` (one hour).

        For more information, see [Using monitor reports](https://www.striim.com/docs/en/using-monitor-reports.html) and [Using the MON command](https://www.striim.com/docs/en/using-the-mon-command.html).
      summary: retrieve monitoring report
      tags:
